<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/stylesheet.css}">
    <style>
        body {
            padding-top: 200px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/menu :: menu"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Nuevo Producto</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/usuario/admin/producto/guardar}" method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>

                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="3"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>Precio</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">$</span>
                                    </div>
                                    <input type="number" step="0.01" class="form-control" name="precio" required>
                                </div>
                            </div>

                            <div class="form-group col-md-6">
                                <label>Categoría</label>
                                <select class="form-control" name="categoriaId" required>
                                    <option value="">Seleccione una categoría</option>
                                    <option th:each="categoria : ${categorias}"
                                            th:value="${categoria.id}"
                                            th:text="${categoria.nombre}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>Item</label>
                                <select class="form-control" name="itemId" required>
                                    <option value="">Seleccione un item</option>
                                    <option th:each="item : ${items}"
                                            th:value="${item.id}"
                                            th:text="${item.nombre}">
                                    </option>
                                </select>
                            </div>

                            <div class="form-group col-md-6">
                                <label>Línea</label>
                                <select class="form-control" name="lineaId" required>
                                    <option value="">Seleccione una línea</option>
                                    <option th:each="linea : ${lineas}"
                                            th:value="${linea.id}"
                                            th:text="${linea.nombre}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>Material</label>
                                <select class="form-control" name="materialId" required>
                                    <option value="">Seleccione un material</option>
                                    <option th:each="material : ${materiales}"
                                            th:value="${material.id}"
                                            th:text="${material.material}">
                                    </option>
                                </select>
                            </div>

                            <div class="form-group col-md-6">
                                <label>Imagen del producto</label>
                                <div class="custom-file">
                                    <input type="file" class="custom-file-input" id="imagen" name="imagen" required>
                                    <label class="custom-file-label" for="imagen">Seleccionar archivo</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg mr-3">
                                <i class="fas fa-save"></i> Guardar Producto
                            </button>
                            <a th:href="@{/usuario/admin/panel}" class="btn btn-outline-secondary btn-lg">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts necesarios -->
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script>
    // Muestra el nombre del archivo seleccionado
    document.querySelector('.custom-file-input').addEventListener('change', function(e) {
        var fileName = document.getElementById("imagen").files[0].name;
        var nextSibling = e.target.nextElementSibling;
        nextSibling.innerText = fileName;
    });
</script>
</body>
</html>
