<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador - Productos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/stylesheet.css}">
    <style>
        body {
            padding-top: 170px; /* Ajusta este valor según la altura de tu menú */
        }
        .main-container {
            padding-top: 40px;
        }
        .page-title {
            margin-bottom: 0;
        }
        .btn-add-product {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div th:replace="fragments/menu :: menu"></div>

<div class="container main-container">
    <!-- Encabezado con título y botón de nuevo producto -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title">Panel administrador - Productos</h1>
        <a th:href="@{/usuario/admin/producto/nuevo}" class="btn btn-success btn-add-product">
            <i class="fas fa-plus"></i> Nuevo Producto
        </a>
    </div>

    <!-- Mensajes de éxito -->
    <div th:if="${param.exito}">
        <div class="alert alert-success">Operación realizada correctamente.</div>
    </div>
    <div th:if="${param.eliminado}">
        <div class="alert alert-success">Producto eliminado correctamente.</div>
    </div>

    <!-- Tabla de productos -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Imagen</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.id}"></td>
                <td th:text="${producto.nombre}"></td>
                <td>$<span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}"></span></td>
                <td>
                    <img th:if="${producto.rutaFoto != null}"
                         th:src="${producto.rutaFoto}"
                         class="img-thumbnail"
                         style="max-width: 120px; max-height: 120px;"
                         alt="Imagen del producto">
                </td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{'/usuario/admin/producto/' + ${producto.id} + '/editar'}"
                           class="btn btn-sm btn-primary mr-2"
                           title="Editar">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <!-- Formulario de Eliminación -->
                        <form th:action="@{/usuario/admin/producto/{id}/eliminar(id=${producto.id})}"
                              method="post"
                              style="display: inline;"
                              onsubmit="return confirm('¿Estás seguro de eliminar este producto?')">
                            <input type="hidden" name="_method" value="delete" />
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                                <i class="fas fa-trash-alt"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="5" class="text-center">No hay productos registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Formulario oculto para eliminación -->
<form id="formEliminar" method="post" style="display: none;">
    <input type="hidden" name="_method" value="delete" />
</form>

<!-- Scripts de Bootstrap -->
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>


</body>
</html>
