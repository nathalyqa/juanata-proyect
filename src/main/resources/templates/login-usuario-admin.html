<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juanata | Iniciar Sesión</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link th:href="@{/css/stylesheet.css}" rel="stylesheet">
    <link th:href="@{/css/fontello.css}" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/icono-pestanna-pagina-web.png}" />

    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #2e59d9;
            --light-color: #f8f9fc;
            --dark-color: #5a5c69;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-color);
            padding-top: 120px; /* Ajuste para el menú fijo */
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header img {
            width: 120px;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.35rem;
            border: 1px solid #d1d3e2;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }

        .btn-login {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            border-radius: 0.35rem;
            transition: all 0.3s;
            color: white;
        }

        .btn-login:hover {
            background-color: var(--secondary-color);
            transform: translateY(-1px);
            color: white;
        }

        body {
            padding-top: 200px;
        }
    </style>
</head>
<body>
<!-- Incluir el menú de la aplicación -->
<div th:replace="fragments/menu :: menu"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="login-container">
                <div class="login-header">
                    <h1>Iniciar Sesión</h1>
                    <p class="text-muted">Ingresa tus credenciales para continuar</p>
                </div>

                <!-- Mensajes de error/sesión -->
                <div th:if="${param.error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-circle mr-2"></i> Usuario o contraseña incorrectos
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    <i class="fas fa-check-circle mr-2"></i> Has cerrado sesión correctamente
                </div>
                <div th:if="${param.timeout}" class="alert alert-warning">
                    <i class="fas fa-clock mr-2"></i> Tu sesión ha expirado por inactividad
                </div>

                <!-- Formulario de login -->
                <form th:action="@{/usuario/admin/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                    <span class="input-group-text bg-white">
                                        <i class="fas fa-user text-primary"></i>
                                    </span>
                            </div>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="d-flex justify-content-between">
                            <label for="password">Contraseña</label>
                            <a href="#" class="text-primary small">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                    <span class="input-group-text bg-white">
                                        <i class="fas fa-lock text-primary"></i>
                                    </span>
                            </div>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Ingresa tu contraseña" required>
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary toggle-password" type="button">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                        <label class="form-check-label" for="remember-me">Recordar mi sesión</label>
                    </div>

                    <button type="submit" class="btn btn-login mb-3">
                        <i class="fas fa-sign-in-alt mr-2"></i> Iniciar Sesión
                    </button>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">¿No tienes una cuenta?
                            <a th:href="@{/usuario/registrar}" class="text-primary font-weight-bold">Regístrate</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script>
    // Mostrar/ocultar contraseña
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.querySelector('.toggle-password');
        const password = document.querySelector('#password');

        if (togglePassword && password) {
            togglePassword.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
        }
    });
</script>
</body>
</html>
