<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar producto</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
            integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
            integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/stylesheet.css}">
    <style>
        body {
            padding-top: 200px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/menu :: menu"></div>

<div class="container mt-4" th:if="${producto != null}">
    <h1>Editar producto</h1>

    <form th:action="@{'/usuario/admin/producto/' + ${producto.id} + '/editar'}"
          method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label>ID</label>
            <input type="text" class="form-control" th:value="${producto.id}" readonly>
        </div>

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" class="form-control" th:value="${producto.nombre}" readonly>
        </div>

        <div class="form-group">
            <label>Descripción</label>
            <input type="text" class="form-control" name="descripcion" th:value="${producto.descripcion}">
        </div>

        <div class="form-group">
            <label>Categoría</label>
            <select class="form-control" name="categoriaId">
                <option th:each="cat : ${categorias}"
                        th:value="${cat.id}"
                        th:text="${cat.nombre}"
                        th:selected="${producto.categoria != null} ? ${cat.id} == ${producto.categoria.id} : false">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Item</label>
            <select class="form-control" name="itemId">
                <option th:each="it : ${items}"
                        th:value="${it.id}"
                        th:text="${it.nombre}"
                        th:selected="${producto.item != null} ? ${it.id} == ${producto.item.id} : false">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Línea</label>
            <select class="form-control" name="lineaId">
                <option th:each="ln : ${lineas}"
                        th:value="${ln.id}"
                        th:text="${ln.nombre}"
                        th:selected="${producto.linea != null} ? ${ln.id} == ${producto.linea.id} : false">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Material</label>
            <select class="form-control" name="materialId">
                <option th:each="mat : ${materiales}"
                        th:value="${mat.id}"
                        th:text="${mat.material}"
                        th:selected="${producto.material != null} ? ${mat.id} == ${producto.material.id} : false">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Precio</label>
            <input type="number" step="0.01" class="form-control" name="precio" th:value="${producto.precio}">
        </div>

        <div class="form-group">
            <label>Ruta foto actual</label>
            <input type="text" class="form-control" name="rutaFoto" th:value="${producto.rutaFoto}" readonly>
        </div>

        <div class="form-group">
            <label>Imagen actual</label><br>
            <img th:if="${producto.rutaFoto != null}"
                 th:src="${producto.rutaFoto}"
                 class="img-thumbnail" style="max-width: 200px;">
        </div>

        <div class="form-group">
            <label>Nueva imagen (opcional)</label>
            <input type="file" class="form-control-file" name="imagen">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/usuario/admin/panel}" class="btn btn-secondary">Volver</a>
    </form>
</div>

<div class="container mt-4" th:if="${producto == null}">
    <div class="alert alert-danger">Producto no encontrado.</div>
    <a th:href="@{/usuario/admin/panel}" class="btn btn-secondary">Volver</a>
</div>

</body>
</html>
